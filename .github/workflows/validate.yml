name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate generated docs and skill
        run: make check
      - name: Build portable archive
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: see-agent-skill
          path: dist/see-agent-skill.zip
